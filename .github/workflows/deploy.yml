name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would be uploaded
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      # Pushes to main deploy for real; manual runs default to a dry run.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage site files
        run: |
          mkdir _site
          rsync -a \
            --exclude='/_site' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='CLAUDE.md' \
            --exclude='README*' \
            ./ _site/

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload via SFTP
        env:
          SFTP_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_REMOTE_DIR: ${{ vars.SFTP_REMOTE_DIR }}
        run: |
          umask 077
          printf '%s\n' "$SFTP_KEY" > "$RUNNER_TEMP/key"
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"

          flags="--reverse --delete --verbose --parallel=2"
          if [ "$DRY_RUN" = "true" ]; then flags="$flags --dry-run"; fi

          lftp <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set sftp:auto-confirm no
          set sftp:connect-program "ssh -a -x -i $RUNNER_TEMP/key -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/known_hosts"
          open -u "$SFTP_USER",unused sftp://$SFTP_HOST
          mirror $flags _site "$SFTP_REMOTE_DIR"
          bye
          EOF
